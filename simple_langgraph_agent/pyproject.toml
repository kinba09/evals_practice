[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-langgraph-agent"
version = "0.1.0"
description = "A minimal single-agent LangGraph app for evals practice"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.3,<2.0",
    "langchain-openai>=0.3.9,<2.0",
    "langgraph>=0.2,<2.0",
    "python-dotenv>=1.0,<2.0",
    "deepeval>=4.1,<5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
